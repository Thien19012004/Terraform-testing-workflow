name: "Terraform Apply (GEC)"

# Trigger: manual only (workflow_dispatch)
# Flow: plan -> open approval issue with the plan -> wait for "approved"
#       comment -> apply. (Issue-based approval alternative to a GitHub
#       Environment protection rule.)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TF_VERSION: "1.5.7"

jobs:
  apply:
    name: Plan, Approve & Apply — LPI-EM-GEC
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_password:       ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=hub-gec.tfstate"

      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan | tee plan-to-display.txt

      - name: Build approval issue body
        id: issue_body
        run: |
          FULL_PLAN=$(cat plan-to-display.txt)
          # GitHub issue bodies cap at 65536 chars; leave room for the wrapper.
          MAX_LEN=60000
          if [[ ${#FULL_PLAN} -gt $MAX_LEN ]]; then
            FULL_PLAN="${FULL_PLAN:0:$MAX_LEN}"$'\n\n... (plan truncated). See the workflow run logs for the full plan.'
          fi
          {
            echo "body<<BODY_EOF"
            echo "### Terraform Plan — Hub (GEC)"
            echo ""
            echo "Review the plan below, then comment **approved** to apply or **denied** to cancel."
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```terraform'
            echo "$FULL_PLAN"
            echo '```'
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Issue-based manual approval ─────────────────────────────────────────
      # Opens an issue tagging the approver(s). The job waits until an approver
      # comments "approved"; commenting "denied" fails the run. The issue is
      # closed automatically afterwards.
      - name: Wait for approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: Thien19012004        # TODO: set to the GitHub username(s) allowed to approve
          minimum-approvals: 1
          issue-title: "Approve Terraform Apply — Hub (GEC) (run ${{ github.run_id }})"
          issue-body: ${{ steps.issue_body.outputs.body }}
          exclude-workflow-initiator-as-approver: false

      - name: Terraform Apply
        run: terraform apply tfplan
