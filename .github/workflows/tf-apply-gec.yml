name: "Terraform Apply (GEC) — Plan & Request Approval"

# Trigger: manual only (workflow_dispatch)
# Flow: plan -> open an approval issue containing the plan -> STOP.
#       An authorized reviewer then comments "/approve" on that issue, which
#       triggers tf-apply-run-gec.yml to actually apply.
# Uses only first-party actions (actions/*), so it works under org policies
# that restrict third-party actions.

on:
  workflow_dispatch:

concurrency:
  group: terraform-apply-gec
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TF_VERSION: "1.5.7"

jobs:
  plan:
    name: Plan & open approval issue — LPI-EM-GEC
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_password:       ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=hub-gec.tfstate"

      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan | tee plan-to-display.txt

      - name: Open approval issue with plan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan-to-display.txt', 'utf8');
            const MAX = 60000; // GitHub issue bodies cap at 65536 chars
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n\n... (plan truncated). See the workflow run logs for the full plan.';
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Terraform Plan — Hub (GEC)',
              '',
              `Triggered by @${context.actor}. [View run logs](${runUrl})`,
              '',
              'An authorized reviewer must comment **`/approve`** on this issue to deploy.',
              'Comment **`/deny`** to reject and close without applying.',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Approve Terraform Apply — Hub (GEC) (run ${context.runId})`,
              body,
              labels: ['tf-apply-approval'],
            });
            core.notice(`Approval issue opened: ${issue.data.html_url}`);
