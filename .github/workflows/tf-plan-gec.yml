name: "Terraform Plan (GEC)"

# Trigger & behaviour:
#   - push to ANY branch   -> plan + publish to the run summary (visibility)
#   - pull_request to main -> plan + sticky PR comment (preview)
#   - push to main / manual -> plan + save the plan + open an approval issue
# Only Terraform-relevant changes trigger a run (see `paths`); the provider
# plugin cache avoids re-downloading providers on every run.

on:
  workflow_dispatch:
  push:
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  TF_VERSION:      "1.5.7"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  # Decide whether the plan should run. Skips push-triggered runs on a feature
  # branch that already has an open PR, since the pull_request run covers those
  # (avoids double-planning). PR, main pushes, and manual runs always proceed.
  guard:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('should_run', 'true');
              return;
            }
            if (context.ref === 'refs/heads/main') {
              core.setOutput('should_run', 'true');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (prs.length > 0) {
              core.notice(`Open PR #${prs[0].number} exists for '${branch}'; skipping push-triggered plan (the pull_request run covers it).`);
              core.setOutput('should_run', 'false');
            } else {
              core.setOutput('should_run', 'true');
            }

  plan:
    name: Terraform Plan — LPI-EM-GEC
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.should_run == 'true'

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_password:       ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Prime plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=hub-gec.tfstate"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan | tee plan-to-display.txt

      # ── Always: show the plan on the run summary (visibility for any push) ────
      - name: Publish plan to run summary
        run: |
          {
            echo '### Terraform Plan — Hub (GEC)'
            echo ''
            echo '```terraform'
            head -c 900000 plan-to-display.txt
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── PR path: preview comment only ───────────────────────────────────────
      - name: Truncate plan for PR comment
        if: github.event_name == 'pull_request'
        id: truncate_plan
        run: |
          FULL_PLAN=$(cat plan-to-display.txt)
          MAX_LEN=$((65536 - 2048))
          if [[ ${#FULL_PLAN} -gt $MAX_LEN ]]; then
            PLAN="${FULL_PLAN:0:$MAX_LEN}"$'\n\n... (plan truncated due to size limit). See the workflow run logs for the full plan.'
          else
            PLAN="$FULL_PLAN"
          fi
          {
            echo "plan<<PLAN_EOF"
            echo "$PLAN"
            echo "PLAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: "${{ steps.truncate_plan.outputs.plan }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- tf-plan:hub-gec -->';
            const body = [
              marker,
              `#### Terraform Plan — Hub (GEC) \`${{ steps.plan.outcome }}\``,
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              process.env.PLAN_OUTPUT,
              '```',
              '',
              '</details>',
              '',
              `*Pusher: @${{ github.actor }}, Workflow: \`${{ github.workflow }}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── Main / manual path: save the plan and open an approval issue ─────────
      - name: Upload plan artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

      - name: Open approval issue with plan
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan-to-display.txt', 'utf8');
            const MAX = 60000; // GitHub issue bodies cap at 65536 chars
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n\n... (plan truncated). See the workflow run logs for the full plan.';
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              // Machine-readable marker: which run holds the saved plan artifact.
              `<!-- plan-run-id: ${context.runId} -->`,
              '### Terraform Plan — Hub (GEC)',
              '',
              `Triggered by @${context.actor} on \`${context.ref}\`. [View run logs](${runUrl})`,
              '',
              'An authorized reviewer must comment **`/approve`** on this issue to deploy.',
              'Comment **`/deny`** to reject and close without applying.',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Approve Terraform Apply — Hub (GEC) (run ${context.runId})`,
              body,
              labels: ['tf-apply-approval'],
            });
            core.notice(`Approval issue opened: ${issue.data.html_url}`);
