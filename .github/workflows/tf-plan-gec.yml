name: "03 Hub — Terraform Plan (GEC)"

# Mirrors: prod-pipelines-check-gec.yml (plan only, no apply)
# Trigger: manually or on PR targeting main

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION:      "1.5.7"

jobs:
  plan:
    name: Terraform Plan — LPI-EM-GEC
    runs-on: ubuntu-latest
    environment: lpi-prod-gec          # set required reviewers here for gating

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_client_id:     ${{ secrets.ARM_CLIENT_ID }}
      TF_VAR_tenant_id:     ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_client_secret: ${{ secrets.ARM_CLIENT_SECRET }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=hub-gec.tfstate"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan | tee plan-to-display.txt

      - name: Truncate plan for PR comment
        if: github.event_name == 'pull_request'
        id: truncate_plan
        run: |
          FULL_PLAN=$(cat plan-to-display.txt)
          MAX_LEN=$((65536 - 2048))
          if [[ ${#FULL_PLAN} -gt $MAX_LEN ]]; then
            PLAN="${FULL_PLAN:0:$MAX_LEN}"$'\n\n... (plan truncated due to size limit). See the workflow run logs for the full plan.'
          else
            PLAN="$FULL_PLAN"
          fi
          {
            echo "plan<<PLAN_EOF"
            echo "$PLAN"
            echo "PLAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: "${{ steps.truncate_plan.outputs.plan }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- tf-plan:hub-gec -->';
            const body = [
              marker,
              `#### Terraform Plan — Hub (GEC) \`${{ steps.plan.outcome }}\``,
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              process.env.PLAN_OUTPUT,
              '```',
              '',
              '</details>',
              '',
              `*Pusher: @${{ github.actor }}, Workflow: \`${{ github.workflow }}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
